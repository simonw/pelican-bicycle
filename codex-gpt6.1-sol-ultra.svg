<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1000" viewBox="0 0 1200 1000" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Pelican on a bicycle</title>
  <desc id="desc">A cheerful white pelican with an enormous golden bill and a coral scarf rides a sea-green bicycle. Its wing reaches the handlebars and its orange webbed feet press the pedals, against a soft coastal sky.</desc>
  <defs>
    <linearGradient id="sky" x1="600" y1="130" x2="600" y2="850" gradientUnits="userSpaceOnUse">
      <stop stop-color="#DCEEEA"/>
      <stop offset="1" stop-color="#EDF2E5"/>
    </linearGradient>
    <linearGradient id="pouch" x1="805" y1="267" x2="841" y2="348" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F5B858"/>
      <stop offset="1" stop-color="#ED9051"/>
    </linearGradient>
    <g id="wheel" stroke="#243F48" stroke-linecap="round" stroke-linejoin="round">
      <circle r="147" fill="#FFFCF4" fill-opacity=".5" stroke-width="14"/>
      <circle r="135" stroke="#92AAA4" stroke-width="3"/>
      <g stroke="#92AAA4" stroke-width="2.5">
        <path d="M0-133V133M-133 0H133M-94-94 94 94M-94 94 94-94M-51-123 51 123M-123-51 123 51M-123 51 123-51M-51 123 51-123"/>
      </g>
      <circle r="12" fill="#F9FAEF" stroke-width="5"/>
    </g>
  </defs>

  <!-- Quiet coastal backdrop. -->
  <path fill="#FBF6E9" d="M0 0H1200V1000H0z"/>
  <circle cx="605" cy="462" r="365" fill="url(#sky)"/>
  <circle cx="287" cy="244" r="54" fill="#EDAB86"/>
  <path d="M219 349c12-26 45-30 63-13 6-34 57-42 77-13 30-10 55 4 60 26H219Z" fill="#FFFDF6"/>
  <path d="M896 174c8-18 29-22 43-10 12-27 49-27 63-1 24-6 43 3 49 21H896Z" fill="#FFFDF6"/>
  <g stroke="#779994" stroke-width="4" stroke-linecap="round">
    <path d="M903 420q13-14 27 0 13-14 27 0M1010 384q10-11 20 0 10-11 20 0"/>
  </g>
  <ellipse cx="610" cy="897" rx="372" ry="22" fill="#D9DED0"/>
  <path d="M184 898h837" stroke="#AABBA9" stroke-width="3" stroke-linecap="round"/>
  <g stroke="#243F48" stroke-linecap="round" stroke-linejoin="round">
    <g stroke="#83A99A" stroke-width="5">
      <path d="M162 897c5-27 1-43-10-61M163 888c11-24 24-33 37-36M1042 897c-1-26 4-44 18-60M1044 883c-12-17-22-23-36-24"/>
    </g>
    <g fill="#83A99A" stroke="none">
      <path d="M151 858c-23-2-30-14-29-28 20 1 32 10 29 28ZM180 873c1-21 12-32 29-33 0 18-11 31-29 33ZM1057 855c-1-20 10-32 26-34 2 18-8 31-26 34ZM1025 873c-20-1-29-11-29-26 18-1 30 9 29 26Z"/>
    </g>

    <!-- Matching wheels, with a reusable spoke pattern. -->
    <use href="#wheel" x="365" y="740"/>
    <use href="#wheel" x="860" y="740"/>

    <!-- Far leg and pedal, behind the frame. -->
    <path d="M524 490c-5 42-2 75 17 104l-40 115" stroke="#243F48" stroke-width="21"/>
    <path d="M524 490c-5 42-2 75 17 104l-40 115" stroke="#E8A44F" stroke-width="11"/>
    <path d="M501 706c-6 7-6 20-1 31l-17 19 32 4 18-9-20-14-1-29" fill="#EAA24C" stroke-width="5"/>
    <path d="m500 735 13 15m-13-1 15 1" stroke="#C77F42" stroke-width="2.5"/>
    <path d="M480 765h53" stroke-width="9"/>

    <!-- Sea-green bicycle frame. Dark edges keep every tube legible. -->
    <path d="M365 740 500 559 573 740H365M500 559H761L573 740M761 559l99 181" stroke-width="22"/>
    <path d="M365 740 500 559 573 740H365M500 559H761L573 740M761 559l99 181" stroke="#3F9B91" stroke-width="12"/>
    <path d="m515 590 49 123M604 707l133-130M402 725h141M532 568h185" stroke="#87C4B2" stroke-width="3"/>
    <path d="m500 559-12-34" stroke-width="13"/>
    <path d="M463 520c20-3 53-2 78 1 6 1 9 7 4 11-18 9-60 9-79 2-7-3-8-11-3-14Z" fill="#B26B51" stroke-width="5"/>
    <path d="M754 567 741 507l54-12" stroke-width="15"/>
    <path d="M754 567 741 507l54-12" stroke="#A6BCB3" stroke-width="7"/>
    <path d="M791 494c33-6 59 1 62 20 2 14-9 22-22 19" stroke-width="10"/>
    <path d="M784 547c29 23 25 69 54 98" stroke-width="3"/>
    <path d="M360 718h13" stroke-width="6"/>

