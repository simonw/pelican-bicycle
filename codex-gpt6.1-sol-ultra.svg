    <path d="M649 305c-36-18-53-45-77-42-26 3-42 8-68-4l19 31-13 20c34 13 71-16 95-3l35 17" fill="#D96852" stroke-width="5"/>
    <path d="M521 283c25 7 42-6 58-4" stroke="#F2997C" stroke-width="4"/>
