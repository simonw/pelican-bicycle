    <path d="M365 726 568 708c39-3 45 51 5 52L365 754c-17-1-18-26 0-28Z" fill="#E3E1CF" fill-opacity=".6" stroke-width="4"/>
    <circle cx="573" cy="740" r="32" fill="#FBF6E9" stroke-width="6"/>
    <circle cx="573" cy="740" r="22" stroke="#97ADA3" stroke-width="3"/>
    <path d="m556 724 34 32m-34 0 34-32" stroke="#97ADA3" stroke-width="4"/>
    <path d="m506 765 67-25 59-62" stroke-width="9"/>
    <circle cx="573" cy="740" r="7" fill="#243F48" stroke="none"/>

    <!-- Plump body, sweeping neck and little tail. -->
    <path d="M448 438c-32-18-62-54-75-91 29 18 52 25 77 25 24-42 67-50 110-61 47-12 70-40 76-86 4-38 17-67 48-73 36-8 70 8 79 37 7 21 2 47-9 66-16 28-47 50-62 83-14 31-14 65-20 105-6 42-29 69-76 74-65 7-120-21-148-79Z" fill="#FFFEF6" stroke-width="6"/>
    <path d="M397 369c15 23 34 40 54 52M414 375c15 15 24 22 37 26" stroke="#A9BBB4" stroke-width="4"/>
    <path d="M666 268c2 48-32 80-49 106-11 17-16 48-11 70 6 27 16 37 35 48 29-23 36-53 38-82 2-31 6-58 18-79 15-27 31-40 40-54" fill="#DCE5DD" stroke="none"/>
    <path d="M464 461c23 29 57 41 84 44" stroke="#D7E1D8" stroke-width="5"/>

