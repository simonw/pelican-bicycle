    <path d="M775 279c6 22 18 42 37 49M794 283c8 20 20 35 37 42" stroke="#FFD78A" stroke-width="4"/>
    <path d="M745 222c75-4 177 18 286 58 10 4 10 8-2 10-95 1-198-12-279-30-10-10-11-25-5-38Z" fill="#F5C363" stroke-width="6"/>
    <path d="M761 242c85 3 162 19 246 41" stroke="#CB8A42" stroke-width="3"/>
    <path d="M776 229c69 1 136 14 196 34" stroke="#FFE2A0" stroke-width="5"/>
    <path d="M1016 277q15 4 15 9l-15 3" fill="#DDA251" stroke-width="3"/>
    <path d="M737 229c-7 11-7 22 3 33" stroke="#B9CAC0" stroke-width="4"/>

    <!-- Bright eye and a relaxed, focused expression. -->
    <circle cx="715" cy="209" r="15" fill="#F3DB8A" stroke="none"/>
    <circle cx="717" cy="209" r="7.5" fill="#243F48" stroke="none"/>
    <circle cx="719" cy="206" r="2.5" fill="#FFFDF6" stroke="none"/>
    <path d="M704 187q10-5 19 0" stroke-width="3.5"/>
    <ellipse cx="726" cy="234" rx="8" ry="5" fill="#EAB59C" stroke="none"/>

    <!-- Near leg reaches a raised pedal. -->
    <path d="M596 492c21 32 40 55 57 69 10 8 9 20 2 31l-39 61" stroke-width="23"/>
    <path d="M596 492c21 32 40 55 57 69 10 8 9 20 2 31l-39 61" stroke="#F1B357" stroke-width="13"/>
    <path d="M616 647c-5 8-5 16 1 26l-4 11c19 8 49 8 61-1l-25-11-20-23" fill="#F3B252" stroke-width="5"/>
    <path d="m632 667 14 12m-22-6 10 8" stroke="#CC8944" stroke-width="2.5"/>
    <path d="M608 693h59" stroke-width="9"/>

    <!-- A feathered wing reaches forward to steer. -->
    <path d="M489 373c33-22 70-9 95 24 35 46 61 70 105 81l103 11c15 2 20 14 7 21-13 6-40 4-69 0-41-3-72-14-102-31-3 16-13 27-24 21-9 13-22 15-31 3-14 6-29 1-36-13-33-13-60-36-66-65-4-19 4-39 18-52Z" fill="#A7BAB2" stroke-width="6"/>
    <path d="M494 389c29-14 51 0 68 22 40 50 76 79 122 88" stroke="#D9E3D9" stroke-width="7"/>
    <path d="M505 429c17 27 39 44 69 55M532 423c23 29 46 47 73 59M563 426c20 24 40 42 64 54" stroke="#688B85" stroke-width="4"/>
    <path d="M787 490c-4 5-3 14 2 18M798 492c-3 4-2 10 1 13" stroke="#688B85" stroke-width="3"/>

    <!-- A few short marks suggest the easy pace. -->
    <g stroke="#7F9E96" stroke-width="5">
      <path d="M186 601h49M170 621h33M181 641h41"/>
    </g>
  </g>
</svg>
